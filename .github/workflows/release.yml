name: Build and Verify

# 只负责“构建并验证”，绝不接触 Release。发布由 publish.yml 通过 workflow_run 托管，
# 这样可取消的构建与不可中断的发布会话彼此隔离。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# 默认仅需读取权限：这一层不写任何仓库内容。
permissions:
  contents: read

# 同一分支上的新构建取消旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: AutoInputSwitcher
  # 版本统一由本工作流的编号推导：显示版本 0.2.<run_number>，构建号 <run>.<attempt>。
  VERSION: 0.2.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
  TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
  # 固定版本的 Sparkle SPM 产物（含 bin/ 工具与 Sparkle.framework），带校验和下载。
  SPARKLE_VERSION: 2.10.0
  SPARKLE_TOOLS_SHA256: 17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959

jobs:
  checks:
    name: Checks and tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Run core checks
        run: swift run AutoInputSwitcherCoreChecks

      - name: Run unit tests
        run: swift test

  build:
    name: Build and verify package
    runs-on: macos-latest
    needs:
      - checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Fail fast when the update public key is not configured
        run: |
          set -euo pipefail
          if grep -qE 'REPLACE_WITH_SPARKLE_ED25519_PUBLIC_KEY' Config/SparklePublicKey.txt; then
            echo "Config/SparklePublicKey.txt 仍是占位公钥，无法产出可自动更新的安装包。" >&2
            echo "请在开发者本机执行 Scripts/setup-sparkle-keys.sh，提交真实公钥后再构建。" >&2
            echo "详见 README 的「一次性生成 Sparkle 密钥」一节。" >&2
            exit 1
          fi

      - name: Fetch pinned Sparkle tools
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Sparkle-for-Swift-Package-Manager.zip"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-for-Swift-Package-Manager.zip"
          echo "$SPARKLE_TOOLS_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          ditto -x -k "$archive" "$RUNNER_TEMP/sparkle-tools"
          chmod +x "$RUNNER_TEMP/sparkle-tools/bin/"*
          "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" --version || true
          echo "SPARKLE_TOOLS_DIR=$RUNNER_TEMP/sparkle-tools" >> "$GITHUB_ENV"

      # 正式版用固定的自签名证书签名，指定要求跨版本不变，辅助功能等系统授权在更新后得以保留。
      # PR 构建不接触证书，仍用 ad-hoc 签名。
      - name: Import code signing certificate
        if: github.event_name != 'pull_request'
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CODESIGN_P12_BASE64" ] || [ -z "$CODESIGN_P12_PASSWORD" ]; then
            echo "缺少 CODESIGN_P12_BASE64 / CODESIGN_P12_PASSWORD，无法产出正式版。" >&2
            echo "详见 README 的「一次性生成代码签名证书」一节。" >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/codesign.p12"
          printf '%s' "$CODESIGN_P12_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CODESIGN_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$certificate"

          fingerprint="$(grep -Eo '^[0-9a-f]{40}$' Config/CodeSigningCertificate.txt)"
          echo "SIGN_IDENTITY=$fingerprint" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "REQUIRE_SIGNING_CERTIFICATE=1" >> "$GITHUB_ENV"

      - name: Build ZIP and DMG
        run: ./Scripts/package-release.sh

      - name: Verify package
        run: ./Scripts/verify-package.sh

      - name: Remove signing keychain
        if: always() && github.event_name != 'pull_request'
        run: security delete-keychain "$RUNNER_TEMP/codesign.keychain-db" 2> /dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoInputSwitcher-macOS
          path: |
            .build/dist/AutoInputSwitcher-macOS.zip
            .build/dist/AutoInputSwitcher-macOS.dmg
            .build/dist/checksums.txt
            .build/dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Report publish eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = "refs/heads/main" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "构建 $TAG 具备发布资格（main 分支手动构建）。"
          elif [ "$REF_NAME" = "refs/heads/main" ] && [ "$EVENT_NAME" = "push" ]; then
            echo "构建 $TAG 具备发布资格（main 分支 push）。"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "构建 $TAG 仅用于验证（PR）。"
          else
            echo "构建 $TAG 仅用于验证（非 main 分支）。"
          fi
